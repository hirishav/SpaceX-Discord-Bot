name: Deploy Bot to AWS EC2

on:
  push:
    branches:
      - main
      - master # Triggers when you push to main or master branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Navigate to the bot folder
            cd ~/SpaceX-Discord-Bot || (git clone https://github.com/${{ github.repository }}.git ~/SpaceX-Discord-Bot && cd ~/SpaceX-Discord-Bot)
            
            # Pull the latest changes from GitHub
            git pull origin main || git pull origin master
            
            # Rebuild and start the bot using docker-compose
            docker compose up --build -d
